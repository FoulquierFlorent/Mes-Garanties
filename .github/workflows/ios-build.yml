name: iOS Build (Unsigned Check)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Configuration de compilation Xcode (sans signature)"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build-ios:
    name: Compilation iOS sans signature
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Sélection de la dernière version stable de Xcode (Xcode 26+ si disponible)
        run: |
          BEST_XCODE=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | grep -v -i beta | head -n 1 || true)
          if [ -n "$BEST_XCODE" ]; then
            echo "Sélection de : $BEST_XCODE"
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2

      - name: Installation des dépendances JavaScript
        run: bun install --frozen-lockfile

      - name: Exécution des tests automatisés
        run: bunx vitest run

      - name: Synchronisation Capacitor iOS et CocoaPods
        run: |
          bunx cap sync ios
          cd ios/App
          pod install --repo-update

      - name: Compilation de l'archive iOS (sans signature)
        run: |
          mkdir -p build
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration "${{ inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/MesGaranties.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Vérification de l'archive générée
        run: |
          ls -la build/MesGaranties.xcarchive
          ls -la build/MesGaranties.xcarchive/Products/Applications/App.app

      - name: Export de l'archive de diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mes-garanties-ios-unsigned-${{ inputs.configuration }}
          path: build/MesGaranties.xcarchive
          retention-days: 7