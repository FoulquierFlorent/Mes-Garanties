name: Android Build (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de compilation à lancer"
        required: true
        default: "debug-apk"
        type: choice
        options:
          - debug-apk
          - release-aab
          - both

permissions:
  contents: read

jobs:
  build-android:
    name: Compilation Android (API 36)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v7

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation de Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Vérification du SDK Android préinstallé et installation de l'API 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "SDK Android introuvable dans $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable dans $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Installation des dépendances
        run: bun install --frozen-lockfile

      - name: Exécution des tests automatisés
        run: bun run test

      - name: Synchronisation Capacitor Android
        run: bunx cap sync android

      - name: Droits d'exécution sur Gradle
        run: chmod +x android/gradlew

      - name: Compilation APK de test (debug)
        if: ${{ inputs.build_type == 'debug-apk' || inputs.build_type == 'both' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publication de l'APK de test
        if: ${{ inputs.build_type == 'debug-apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v7
        with:
          name: mes-garanties-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Préparation temporaire de la clé de signature (si configurée)
        id: signing
        if: ${{ inputs.build_type == 'release-aab' || inputs.build_type == 'both' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Clé de signature détectée : l'AAB sera signé." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun secret ANDROID_KEYSTORE_BASE64 configuré : l'AAB généré ne sera pas signé (non publiable sur Google Play tant que la clé définitive n'est pas configurée)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compilation AAB de distribution (release)
        if: ${{ inputs.build_type == 'release-aab' || inputs.build_type == 'both' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Nettoyage de la clé temporaire
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publication de l'AAB de distribution
        if: ${{ inputs.build_type == 'release-aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v7
        with:
          name: mes-garanties-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error